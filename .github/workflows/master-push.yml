# Build the Sphinx documentation on every push to main, and publish it with GitHub Pages when the
# repository is public (one-time setup: Settings > Pages > Source: "GitHub Actions"). For a private
# repository (GitHub Pages for private repositories needs a paid plan) a push only checks that the
# documentation builds; started by hand, the run attaches the built site as the "github-pages"
# artifact, to download.
name: Documentation
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Sphinx requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt

      - name: Build documentation
        working-directory: docs
        run: make html

      # Public repository: the site to deploy. Private repository: GitHub Pages is not available, so
      # the site is only attached when the workflow is started by hand (Actions > Documentation > Run
      # workflow), as a draft to download; pushes only check that the documentation builds.
      # Artifacts of private repositories count against the account's storage quota: kept one day.
      - name: Attach the site to the run
        if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/build/html
          retention-days: 1

  deploy:
    needs: build
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
