# Build the engine and check it is bit-exact against GTDB-Tk's pplacer on every push.
# ARM64 runners are free for public repositories only: the ARM64 job runs when the repository is public.
name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ github.event.repository.private && fromJSON('["ubuntu-24.04"]') || fromJSON('["ubuntu-24.04", "ubuntu-24.04-arm"]') }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Cache GSL 1.16 build
        uses: actions/cache@v6
        with:
          path: ~/.cache/gplace/build/gsl116
          key: gsl116-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Rust toolchain (the engine is Rust)
        run: |
          command -v cargo || curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install gPlace (compiles the engine)
        env:
          GPLACE_BUILD_JOBS: 4
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Check the engine
        run: gplace check_install

      - name: Placement test (bit-identical to pplacer)
        run: gplace test --models --cpus 2 --out_dir test_out

      - name: Portable engine (scalar kernels; same results as AVX2 / NEON)
        env:
          GPLACE_ENGINE_VARIANT: portable
        run: |
          gplace check_install
          gplace test --models --cpus 2

      - name: Unit tests
        shell: bash          # with pipefail: failing tests still fail the step through tee
        run: python -m unittest discover -s tests 2>&1 | tee unit.log

      # README badges (pushes to main, x86-64 job): counts written to a gist, shown by shields.io.
      # Needs the repository secret GIST_SECRET (a token with the gist scope).
      - name: Count results for the badges
        id: count
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.runner == 'ubuntu-24.04'
        run: python .github/badge_counts.py unit.log test_out/test/gplace_test_report.tsv >> "$GITHUB_OUTPUT"

      - name: Update the unit-test badge
        if: always() && steps.count.outcome == 'success'
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: 08bdf557b640135e66112abccdc87bcc
          filename: gplace-tests.json
          label: unit tests
          message: ${{ steps.count.outputs.tests_message }}
          color: ${{ steps.count.outputs.tests_color }}

      - name: Update the pplacer-parity badge
        if: always() && steps.count.outcome == 'success'
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: 08bdf557b640135e66112abccdc87bcc
          filename: gplace-parity.json
          label: pplacer parity
          message: ${{ steps.count.outputs.parity_message }}
          color: ${{ steps.count.outputs.parity_color }}
