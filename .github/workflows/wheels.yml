# Build the prebuilt manylinux wheel (engine + GSL 1.16 compiled inside the manylinux2014
# container), check it is bit-exact, then install and test it on other distributions/Pythons.
name: Wheels
on:
  workflow_call:
  workflow_dispatch:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]       # x86-64, ARM64 (native runners)
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Build and test the wheel in manylinux2014 (cibuildwheel)
        uses: pypa/cibuildwheel@v2.22.0
        with:
          output-dir: wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: dist-wheel-${{ matrix.runner }}
          path: wheelhouse/*.whl

  install-test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.12', container: '', variant: ''}
          - {os: ubuntu-latest, python: '3.13', container: '', variant: ''}
          - {os: ubuntu-latest, python: '3.12', container: '', variant: 'portable'}  # x86-64 without AVX2
          - {os: ubuntu-latest, python: '', container: 'python:3.12-slim-bullseye', variant: ''}   # Debian 11, glibc 2.31
          - {os: ubuntu-latest, python: '', container: 'python:3.13-slim-bookworm', variant: ''}   # Debian 12, glibc 2.36
          - {os: ubuntu-24.04-arm, python: '3.12', container: '', variant: ''}       # ARM64 (NEON)
          - {os: ubuntu-24.04-arm, python: '3.12', container: '', variant: 'portable'}  # ARM64 scalar
          - {os: ubuntu-24.04-arm, python: '', container: 'python:3.13-slim-bookworm', variant: ''}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/setup-python@v5
        if: matrix.python != ''
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/download-artifact@v4
        with:
          name: dist-wheel-${{ startsWith(matrix.os, 'ubuntu-24.04-arm') && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
          path: wheelhouse

      - name: Install the wheel (no compiler needed)
        run: python -m pip install wheelhouse/*.whl

      - name: Bit-exactness checks
        env:
          GPLACE_ENGINE_VARIANT: ${{ matrix.variant }}
        run: |
          gplace check_install
          gplace test --models --cpus 2
