# Build the prebuilt manylinux wheel (engine + GSL 1.16 compiled inside the manylinux2014
# container), check it is bit-exact, then install and test it on other distributions/Pythons.
# ARM64 runners are free for public repositories only: the ARM64 wheel is built and tested when the
# repository is public.
name: Wheels
on:
  workflow_call:
  workflow_dispatch:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        runner: ${{ github.event.repository.private && fromJSON('["ubuntu-24.04"]') || fromJSON('["ubuntu-24.04", "ubuntu-24.04-arm"]') }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Build and test the wheel in manylinux2014 (cibuildwheel)
        uses: pypa/cibuildwheel@v2.22.0
        with:
          output-dir: wheelhouse

      - uses: actions/upload-artifact@v7
        with:
          name: dist-wheel-${{ matrix.runner }}
          path: wheelhouse/*.whl

  install-test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python: '3.12', container: '', variant: ''}
          - {python: '3.13', container: '', variant: ''}
          - {python: '3.12', container: '', variant: 'portable'}                    # x86-64 without AVX2
          - {python: '', container: 'python:3.12-slim-bullseye', variant: ''}        # Debian 11, glibc 2.31
          - {python: '', container: 'python:3.13-slim-bookworm', variant: ''}        # Debian 12, glibc 2.36
    runs-on: ubuntu-24.04
    container: ${{ matrix.container }}
    steps:
      - uses: actions/setup-python@v7
        if: matrix.python != ''
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/download-artifact@v8
        with:
          name: dist-wheel-ubuntu-24.04
          path: wheelhouse

      - name: Install the wheel (no compiler needed)
        run: python -m pip install wheelhouse/*.whl

      - name: Bit-exactness checks
        env:
          GPLACE_ENGINE_VARIANT: ${{ matrix.variant }}
        run: |
          gplace check_install
          gplace test --models --cpus 2

  install-test-arm:
    needs: build
    if: ${{ !github.event.repository.private }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python: '3.12', container: '', variant: ''}                             # ARM64 (NEON)
          - {python: '3.12', container: '', variant: 'portable'}                     # ARM64 scalar
          - {python: '', container: 'python:3.13-slim-bookworm', variant: ''}
    runs-on: ubuntu-24.04-arm
    container: ${{ matrix.container }}
    steps:
      - uses: actions/setup-python@v7
        if: matrix.python != ''
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/download-artifact@v8
        with:
          name: dist-wheel-ubuntu-24.04-arm
          path: wheelhouse

      - name: Install the wheel (no compiler needed)
        run: python -m pip install wheelhouse/*.whl

      - name: Bit-exactness checks
        env:
          GPLACE_ENGINE_VARIANT: ${{ matrix.variant }}
        run: |
          gplace check_install
          gplace test --models --cpus 2
