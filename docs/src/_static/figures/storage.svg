<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350" role="img" aria-labelledby="title desc">
<title id="title">Likelihood vectors kept by pplacer and by gPlace</title>
<desc id="desc">The same small tree twice. pplacer keeps distal, proximal and supernode vectors for every node; gPlace keeps distal and proximal vectors for internal nodes only and rebuilds leaf vectors when they are needed.</desc>
