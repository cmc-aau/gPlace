<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 352" width="900" height="352" role="img" aria-labelledby="title desc">
<title id="title">The prefilter of tiled placement, tile by tile</title>
<desc id="desc">One query is scored against a 30-edge tree in three tiles, one tile in memory at a time. After each tile its best edges are merged into a short list; after the last tile the list is the start of pplacer's ranking of all the edges. Edges 13 and 27 have equal scores, so the lower edge number comes first, as in pplacer.</desc>
