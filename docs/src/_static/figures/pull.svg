<g class="a6"><text x="440" y="176" font-size="13" fill="#141414" text-anchor="middle" font-weight="bold">× 2<tspan dy="-6" font-size="9.5">28</tspan></text><path d="M414 187 H462" fill="none" stroke="#141414" stroke-width="1.6"/><path d="M456 181 l6 6 l-6 6" fill="none" stroke="#141414" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></g>
