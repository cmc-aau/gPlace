<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 352" width="900" height="352" role="img" aria-labelledby="title desc">
<title id="title">One exponent pull, bit by bit</title>
<desc id="desc">Four values of one site before and after a pull. Every value is multiplied by 2 to the power 28: its exponent changes, its 52 mantissa bits are identical, and the site exponent goes from 0 to -28, so every value times 2 to the power e is unchanged.</desc>
<style>text{font-family:"Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif}.mono{font-family:Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace}.static-only{display:none}@keyframes growX{from{transform:scaleX(0)}}@keyframes growY{from{transform:scaleY(0)}}@keyframes fadein{from{opacity:0}}@keyframes draw{from{stroke-dashoffset:1}}.a1{animation:ka1 10s ease-in-out infinite}@keyframes ka1{0.000%{opacity:0}14.000%{opacity:0}17.000%{opacity:1}94.000%{opacity:1}97.000%{opacity:0}100.000%{opacity:0}}.a2{animation:ka2 10s ease-in-out infinite}@keyframes ka2{0.000%{opacity:0}18.500%{opacity:0}21.500%{opacity:1}94.000%{opacity:1}97.000%{opacity:0}100.000%{opacity:0}}.a3{animation:ka3 10s ease-in-out infinite}@keyframes ka3{0.000%{opacity:0}23.000%{opacity:0}26.000%{opacity:1}94.000%{opacity:1}97.000%{opacity:0}100.000%{opacity:0}}.a4{animation:ka4 10s ease-in-out infinite}@keyframes ka4{0.000%{opacity:0}27.500%{opacity:0}30.500%{opacity:1}94.000%{opacity:1}97.000%{opacity:0}100.000%{opacity:0}}.a5{animation:ka5 10s ease-in-out infinite}@keyframes ka5{0.000%{opacity:0}34.500%{opacity:0}37.500%{opacity:1}94.000%{opacity:1}97.000%{opacity:0}100.000%{opacity:0}}.a6{animation:ka6 10s ease-in-out infinite}@keyframes ka6{0.000%{opacity:0}6.000%{opacity:0}9.000%{opacity:1}94.000%{opacity:1}97.000%{opacity:0}100.000%{opacity:0}}.a7{animation:ka7 10s ease-in-out infinite}@keyframes ka7{0.000%{opacity:0}43.500%{opacity:0}46.500%{opacity:1}94.000%{opacity:1}97.000%{opacity:0}100.000%{opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.transient{display:none}.static-only{display:inline}}</style>
<text x="20" y="30" font-size="15" fill="#141414" font-weight="bold">One site of a likelihood vector, before and after a pull</text>
<text x="20" y="49" font-size="12.5" fill="#6b6b6b">4 of its 20 values; each double is drawn as its binary exponent and its 52 mantissa bits</text>
<text x="20" y="82" font-size="13.5" fill="#141414" font-weight="bold">Before the pull</text>
<text x="20" y="102" font-size="11.5" fill="#6b6b6b">value</text>
<text x="152" y="102" font-size="11.5" fill="#6b6b6b" text-anchor="middle">exponent</text>
<text x="304" y="102" font-size="11.5" fill="#6b6b6b" text-anchor="middle">mantissa bits</text>
<text x="20" y="132" font-size="13" fill="#141414" class="mono">3.1e−9</text>
<rect x="108" y="112" width="88" height="30" fill="#fdf3e4" stroke="#d4972f" stroke-width="1.2" rx="5"/>
<text x="152" y="132" font-size="13" fill="#141414" text-anchor="middle">2<tspan dy="-6" font-size="9.5">−29</tspan></text>
