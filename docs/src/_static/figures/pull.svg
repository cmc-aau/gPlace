<text x="40" y="337" font-size="12.5" fill="#6b6b6b">changes: every exponent +28, the site exponent e −28</text>
<g class="a7"><circle cx="484" cy="332" r="7.5" fill="#8f5e12"/><path d="M480.62 332 l2.4 2.4 l4.35 -4.65" fill="none" stroke="#ffffff" stroke-width="1.95" stroke-linecap="round" stroke-linejoin="round"/><text x="498" y="337" font-size="12.5" fill="#8f5e12" font-weight="bold">identical: the 52 mantissa bits, so nothing is rounded</text></g>
