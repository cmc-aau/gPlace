<text x="152" y="252" font-size="13" fill="#141414" text-anchor="middle">2<tspan dy="-6" font-size="9.5">−29</tspan></text>
<rect x="204" y="232" width="200" height="30" fill="#e8eff8" stroke="#5b83b5" stroke-width="1.2" rx="5"/>
<text x="304" y="251.5" font-size="12.5" fill="#141414" text-anchor="middle" class="mono">12e0be826d695</text>
