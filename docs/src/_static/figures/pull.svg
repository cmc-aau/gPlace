<text x="256" y="300" font-size="13" fill="#141414" text-anchor="middle" font-weight="bold">site exponent e = 0</text>
<text x="476" y="82" font-size="13.5" fill="#141414" font-weight="bold">After the pull</text>
<text x="476" y="102" font-size="11.5" fill="#6b6b6b">value</text>
<text x="608" y="102" font-size="11.5" fill="#6b6b6b" text-anchor="middle">exponent</text>
