[package]
name = "gplace-core"
version = "3.0.0"
edition = "2021"
rust-version = "1.75"            # oldest Rust tested (Ubuntu 24.04's); also keeps Cargo.lock at v3
description = "gPlace placement engine: exact re-implementation of pplacer v1.1.alpha19's numerical core"
license = "GPL-3.0-or-later"
publish = false

# No dependencies: the engine builds offline. GSL 1.16, CORE-MATH (exp, log, pow, sin) and
# glibc 2.19's hypot are third-party C, compiled by gplace/engine/build.py and linked by build.rs.

[lib]
name = "gplace_core"
crate-type = ["cdylib"]          # loaded by Python with ctypes; exports the xp_* C functions

[profile.release]
opt-level = 3
codegen-units = 1
panic = "abort"                  # never unwind into C (GSL callbacks) or Python
debug = false

[lints.rust]
# build.py selects the state count (xp_dna: 4 states, else 20) and, on ARM64, the scalar engine
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(xp_dna)', 'cfg(xp_force_scalar)'] }
