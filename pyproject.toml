[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gtdb-gplace"
# Version is the ONLY dynamic field
dynamic = ["version"]

description = "Exact, memory-bounded re-implementation of the pplacer placements used by GTDB-Tk."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"

authors = [
  {name = "Pierre-Alain Chaumeil"}
]

urls = {repository = "https://github.com/cmc-aau/gPlace"}

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "numpy >= 1.26",
    "tqdm ~= 4.67",
]

[project.scripts]
gplace = "gplace.__main__:main"

[tool.setuptools.dynamic]
# Only the version is pulled from __init__.py
version = {attr = "gplace.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["gplace*"]

[tool.setuptools.package-data]
gplace = [
    "engine/csrc/*.c",
    "engine/csrc/core-math/*",
    "engine/csrc/core-math/pow/*",
    "engine/csrc/glibc/*",
    "engine/data/*",
    "tests/data/*",
    "tests/data/mini.refpkg/*",
    "tests/data/models/*",
    "tests/data/models/*.refpkg/*",
    "tests/data/parity/*",
    "tests/data/tools/*",
    "tests/data/options/*",
    "tests/data/fits/*",
]

[tool.cibuildwheel]
# One py3-none wheel per architecture (the engine is loaded with ctypes), built in the
# manylinux2014 container (glibc 2.17) so it runs on any Linux distribution from the last decade:
# x86-64 (avx2 + portable engines) and ARM64 (neon + portable engines). Each runner builds its own arch.
build = "cp312-manylinux_x86_64 cp312-manylinux_aarch64"
archs = ["native"]
manylinux-x86_64-image = "manylinux2014"
manylinux-aarch64-image = "manylinux2014"
# The container's compiler differs from a developer machine's: the wheel is only accepted if
# the compiled engine is bit-exact and reproduces pplacer on the bundled genomes.
test-command = "gplace check_install && gplace test --models --cpus 2"

[tool.cibuildwheel.linux]
environment = { GPLACE_BUILD_JOBS = "4", GPLACE_BUILD_DIR = "/tmp/gplace_build" }
repair-wheel-command = "auditwheel repair -w {dest_dir} {wheel}"
